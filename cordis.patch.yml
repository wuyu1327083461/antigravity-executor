# Antigravity executor bridge — native tool plugin.
#
# Toggling this bundle off in dsh's plugins page unregisters the
# `delegate_coding_task` / `check_environment` / `list_conversations` tools.
# Nothing is spawned either way: the plugin runs in-process and talks to the
# Antigravity desktop Language Server over its own HTTP + CLI surface.
#
# The config below is the thinking-level selector, the workspace policy, the
# turn-settlement tuning, the quota guard and the audit/kill-switch pair.
# Change a value here and (with HMR on) it applies on the next tool call.
# Every key is optional; the schema defaults are restated so the choices are
# visible in one place. See lib/config-schema.js for the authoritative list.
- insert:
    - id: antigravity-executor
      name: 'antigravity-executor'
      config:
        # Default thinking tier for a delegation: minimal | low | medium | high | extra_high
        # maps onto Antigravity's flash_lite | flash | pro.
        thinkingLevel: medium
        # Let the model override the level per call with `thinking_level`.
        allowOverride: true
        # Work in the dsh session's own working directory (workspace_dir optional).
        followSessionWorkspace: true
        # Refuse a workspace_dir that sits outside the session workspace.
        allowOutsideWorkspace: false
        # Audit the transcript afterwards and report out-of-workspace access.
        audit: true
        # Keep false to report escapes; set true to reject the whole result.
        failOnEscape: false
        maxSeconds: 900

        # --- turn settlement (REQ-01) -------------------------------------
        # A finished turn is detected from the Language Server's own RPC state,
        # so a completed delegation returns within a few seconds instead of
        # always waiting out the quiet window. `quietWindowSeconds` is only the
        # fallback used when that RPC is unavailable.
        pollIntervalSeconds: 2
        # Confirmation window after the server reports IDLE, to avoid settling
        # during the brief gap between two tool rounds.
        fastSettleSeconds: 2
        quietWindowSeconds: 45

        # --- anti-truncation (REQ-02) -------------------------------------
        # Read transcript_full.jsonl so reports over ~4000 characters and long
        # run_command lines are not silently cut short.
        useFullTranscript: true

        # --- account quota guard (REQ-03) -----------------------------
        # When the pro tier is nearly exhausted, run the delegation on flash
        # instead of failing or hanging. pro and flash share ONE "Gemini Models"
        # pool, so downgrading lowers the per-task burn rate rather than moving
        # to a separate budget.
        quotaFallback:
          enabled: true
          # 5-hour window: below this, cut the burn rate.
          proMinFraction: 0.05
          # Weekly window is far more precious (a drained week costs days, a
          # drained 5h window costs hours), so it is guarded at a higher level.
          weeklyProMinFraction: 0.15
          weeklyGuard: true
          # Skip the weekly guard once its reset is this close.
          weeklyReserveHours: 24
          # Reuse a quota read for this long so a fast reject-and-retry loop does
          # not produce a burst of account calls. Near the guard the cache is
          # abandoned on purpose; check_environment always reads live.
          cacheTtlSeconds: 180

        # --- safety, persistence, artifacts (REQ-04/06/07) ----------------
        # Mid-flight circuit breaker. DESTRUCTIVE commands (reg delete, diskpart,
        # recursive force-delete, …) are always cut while this is true, no matter
        # what failOnEscape says: tolerating an out-of-workspace read was never
        # meant to mean tolerating `reg delete`. Ordinary workspace escapes
        # (cd-outside / write-outside) additionally require failOnEscape: true.
        realtimeKillSwitch: true
        # Persist session_id -> conversation_id so a dsh restart can resume.
        # A dead mapping (thread deleted in the app) is evicted automatically.
        persistSessions: true
        # Collect walkthrough.md / implementation_plan.md / task.md from the
        # brain directory into the delegation result.
        includeBrainArtifacts: true
        # Audit in full, report compactly: a shorter .md is inlined verbatim; a
        # longer one is headed (maxArtifactHeadChars) and accompanied by its
        # absolute path, so the planner can read the rest only when it needs it.
        maxArtifactInlineChars: 4000
        maxArtifactHeadChars: 2000
        # Suggest a fresh session_id once one conversation has run this many
        # turns (each extra turn re-sends a longer history, costing more quota).
        longSessionTurns: 8
        # Warn when a dev server / watch process is still running this long; such
        # a command never exits and would otherwise burn the whole budget.
        hangingCommandWarnSeconds: 45

        # --- human-like pacing (v0.5.0) --------------------------------
        # Never delays a turn's result; only tops up the gap before the NEXT
        # delegation, with jitter so consecutive gaps are not metronome-regular.
        pacing:
          enabled: true
          minGapSeconds: 15
          jitterMinSeconds: 6
          jitterMaxSeconds: 15
